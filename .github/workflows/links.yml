# 每周一跑一遍全书来源链接，结果在那次运行的 Summary 页。
# 工作流本身永远是绿的：只有「确定失效」那档要修（404、410）。
# 「没连上」多半是 gov.cn 挡境外机房 IP，浏览器能开就不算失效。
name: 来源链接

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  links:
    name: 检查来源链接
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-links.mjs
