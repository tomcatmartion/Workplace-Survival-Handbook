# 正文一改就重新生成三样，挂到固定的 Release「epub-latest」上，下载链接不变：
#   EPUB        .../epub-latest/Workplace-Survival-Handbook.epub
#   离线单文件  .../epub-latest/Workplace-Survival-Handbook.html
#   Anki 牌组  .../epub-latest/Workplace-Survival-Handbook.apkg
# PR 只生成并校验，不发布，产物在 Actions 页面的 artifact 里。
name: 电子书

on:
  push:
    branches: [main]
    paths:
      - README.md
      - index.html
      - og.png
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  pull_request:
    paths:
      - README.md
      - index.html
      - og.png
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 交叉引用检查。单独一个 job，不挂在 build 里：锚点没补好不该连累 EPUB 和
  # 离线单文件的发布，那是两回事。PR 上照样红，main 上该发的还是发出去。零依赖。
  refs:
    name: 交叉引用检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-refs.mjs --check

  # 说人话检查：长度、行话、抽象说法。理由同上，单独一个 job，不挡发布。
  plain:
    name: 说人话检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-plain.mjs

  # 拆分规则一致性检查：index.html 里的那份规则和 tools/lib/split-items.mjs 必须同步。
  split:
    name: 拆分规则一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-split.mjs

  # 统计数字检查：README、index.html、og.html 上的数字必须和正文一致。
  stats:
    name: 统计数字检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sync-stats.mjs --check

  build:
    name: 生成三样
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json

      - name: EPUB
        run: |
          npm ci
          node build.mjs
        working-directory: tools/epub

      - name: 离线单文件 HTML
        run: node tools/offline/build.mjs

      - name: Anki 牌组
        run: node tools/anki/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # epubcheck 只是提示，不该挡发布：正文能不能过校验，和该不该把三样发出去是两回事。
      - name: epubcheck
        continue-on-error: true
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/Workplace-Survival-Handbook.epub || true

      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: |
            dist/Workplace-Survival-Handbook.epub
            dist/Workplace-Survival-Handbook.html
            dist/Workplace-Survival-Handbook.apkg

      - name: 发布到 Release epub-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f epub-latest
          git push -f origin epub-latest
          notes="正文提交 ${GITHUB_SHA::7}，生成于 $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M')（北京时间）。EPUB、离线单文件 HTML、Anki 牌组三样，正文每次更新后自动重新生成，下载链接固定不变。"
          if gh release view epub-latest >/dev/null 2>&1; then
            gh release edit epub-latest --title "电子书（EPUB / 离线 HTML / Anki，自动更新）" --notes "$notes"
          else
            gh release create epub-latest --title "电子书（EPUB / 离线 HTML / Anki，自动更新）" --notes "$notes" --latest=false
          fi
          gh release upload epub-latest \
            dist/Workplace-Survival-Handbook.epub \
            dist/Workplace-Survival-Handbook.html \
            dist/Workplace-Survival-Handbook.apkg --clobber
